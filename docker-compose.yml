version: "3.9"

services:
  web:
    build: .
    ports:
      - "8001:8001"
    volumes:
      # Persist the SQLite database across container restarts
      - easyrecruit_data:/app/backend/app/data
    environment:
      - HOST=0.0.0.0
      - PORT=8001
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY:-change-me-please-use-a-long-random-string}
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - DATABASE_PATH=/app/backend/app/data/easyrecruit.db
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  easyrecruit_data:
    driver: local
